name: terraform-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

#Default: the workflow token can do nothing. Each job asks for only what it needs.
permissions: {}

concurrency:
  group: terraform-${{github.ref}}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: zizmor - lint this workflow
        run: |
          pipx install zizmor==1.32.0
          zizmor --offline .github/workflows

      - name: terraform fmt (Verify human-written module only)
        run: |
          rc=0
          for d in modules envs bootstrap; do terraform fmt -check -recursive "$d" || rc=1; done
          exit $rc
      - name: terraform validate (Validate human-written module only)  
        run: |
          # -lockfile=readonly: fail if providers don't match the committed .terraform.lock.hcl
          for d in bootstrap envs/dev; do
            terraform -chdir="$d" init -backend=false -lockfile=readonly
            terraform -chdir="$d" validate
          done  

      - name: Trivy - Baseline Scanner must pass Critical and High
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_CHECK_UPDATE: "true"   # use the rules embedded in v0.76.2, so results are reproducible
        with:
          scan-type: config
          scan-ref: .
          version: v0.76.2
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: tests/fixtures,ai-twin

      - name: Install Checkov (Pinned)
        run: pipx install checkov==3.4.0

      - name: Checkov - Baseline Scanner must pass
        run: checkov -d modules -d envs -d bootstrap --config-file .checkov.yaml
# Each fixture must produce specific rule IDs. A crashed scanner reports nothing, so it fails too.
# Needs trivy on PATH from the Trivy baseline step above: keep this step after it.
      - name: Fixtures - scanners must report the expected rule IDs
        run: ./scripts/assert-fixtures.sh
  plan:
    name: plan
    needs: static
    # Fork PRs get no OIDC token, so only run for this repo's own branches
    # Skipped until the CI role exists (and again after teardown, once the variable is deleted)
    if: vars.AWS_PLAN_ROLE_ARN != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents : read
      id-token: write #Requests OIDC Token
    env:
      TF_VAR_project: ${{ vars.PROJECT }}
      TF_VAR_github_repo: ${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_access_log_bucket: ${{ vars.ACCESS_LOG_BUCKET }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{vars.AWS_PLAN_ROLE_ARN}}
          aws-region: us-east-1
          role-session-name: gha-plan
      - name: terraform init (remote)
        run:  terraform -chdir=envs/dev init -lockfile=readonly -backend-config="bucket=${TF_VAR_state_bucket}"
      - name: terraform plan (Summary Only)
        run: |
          set +e
          terraform -chdir=envs/dev plan -lock-timeout=120s -no-color -detailed-exitcode > plan.log 2>&1
          code=$?
          set -e
          grep -E '^(Plan:|No changes)' plan.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          if [ "$code" -eq 1 ]; then
            echo "Plan failed. Last lines:"; tail -n 30 plan.log; exit 1
          fi
          echo "Plan exit code: $code (0 = no changes, 2 = changes present)"
        